<svg width="64" height="64" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconRunnerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00425b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#006885;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B44E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="45" fill="#00425b" opacity="0.1"/>
  
  <!-- Running Person Icon (centered and scaled) -->
  <g transform="translate(60, 60)">
    <!-- Head -->
    <circle cx="20" cy="15" r="10" fill="#00425b"/>
    
    <!-- Torso -->
    <line x1="10" y1="25" x2="30" y2="25" stroke="#00425b" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Right arm - forward (green gradient) -->
    <path d="M 30 25 Q 40 8 45 5" 
          stroke="url(#faviconRunnerGradient)" 
          stroke-width="7" 
          fill="none" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Left arm - backward (dark teal/blue) -->
    <path d="M 10 25 Q 0 35 -5 40" 
          stroke="#00425b" 
          stroke-width="7" 
          fill="none" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Right leg - forward (green gradient) -->
    <path d="M 30 25 Q 35 45 32 65" 
          stroke="url(#faviconRunnerGradient)" 
          stroke-width="7" 
          fill="none" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M 32 65 Q 30 72 28 75" 
          stroke="url(#faviconRunnerGradient)" 
          stroke-width="7" 
          fill="none" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Left leg - backward (dark teal/blue) -->
    <path d="M 10 25 Q 5 40 3 55" 
          stroke="#00425b" 
          stroke-width="7" 
          fill="none" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M 3 55 Q 1 62 -1 68" 
          stroke="#00425b" 
          stroke-width="7" 
          fill="none" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
